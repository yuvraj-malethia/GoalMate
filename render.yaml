# Render blueprint: one Node web service. The database is a free Neon PostgreSQL
# (or any PostgreSQL); paste its connection string as DATABASE_URL when Render asks.
# Steps: README → Deploy.
services:
  - type: web
    name: goalmate
    runtime: node
    plan: free
    # Vite and Tailwind are devDependencies, needed only for the build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # e.g. postgres://user:password@ep-xxx.neon.tech/goalmate?sslmode=verify-full
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
